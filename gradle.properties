# Propriedades do build do Tuprel.
#
# Este ficheiro é deliberadamente mínimo. A Fase 0 não faz tuning especulativo
# de Gradle: cada propriedade tem de ter uma razão explícita e verificável.
#
# Intencionalmente NÃO configurado neste slice:
# - org.gradle.configuration-cache  (slice posterior, precisa de build real)
# - org.gradle.caching              (slice posterior, precisa de build real)
# - org.gradle.parallel             (sem valor num build de projecto único)
# - org.gradle.jvmargs              (tuning dependente de máquina)
# - org.gradle.java.home            (caminho específico de máquina; a toolchain
#                                    Java é responsabilidade de slice posterior)
# - credenciais de publicação       (nunca neste repositório)

# Torna visíveis todos os avisos de deprecation do Gradle em vez do resumo
# silencioso por omissão. Suporta a regra de qualidade do projecto: warnings
# novos são tratados, não ignorados (ver CLAUDE.md).
org.gradle.warning.mode=all
