<text x="20" y="31" fill="#62cbb8" font-size="12" font-weight="700">01</text>
<text x="20" y="55" fill="#e6edf3" font-size="15" font-weight="600">Schema</text>
<text x="20" y="77" fill="#aabac8" font-size="12" font-family="Consolas, monospace">schema.tuprel</text>
<path d="M166 52h16m-4-4 4 4-4 4" fill="none" stroke="#62cbb8" stroke-width="1.5"/>
<rect x="186" y="8" width="156" height="88" rx="9" fill="#161b22" stroke="#3d4b59"/>
<text x="200" y="31" fill="#62cbb8" font-size="12" font-weight="700">02</text>
<text x="200" y="55" fill="#e6edf3" font-size="15" font-weight="600">Java generation</text>
<text x="200" y="77" fill="#aabac8" font-size="12" font-family="Consolas, monospace">tuprel generate</text>
<path d="M346 52h16m-4-4 4 4-4 4" fill="none" stroke="#62cbb8" stroke-width="1.5"/>
<rect x="366" y="8" width="156" height="88" rx="9" fill="#161b22" stroke="#3d4b59"/>
<text x="380" y="31" fill="#62cbb8" font-size="12" font-weight="700">03</text>
<text x="380" y="55" fill="#e6edf3" font-size="15" font-weight="600">Type-safe client</text>
<text x="380" y="77" fill="#aabac8" font-size="12" font-family="Consolas, monospace">TuprelClient</text>
<path d="M526 52h16m-4-4 4 4-4 4" fill="none" stroke="#62cbb8" stroke-width="1.5"/>
<rect x="546" y="8" width="156" height="88" rx="9" fill="#161b22" stroke="#3d4b59"/>
<text x="560" y="31" fill="#62cbb8" font-size="12" font-weight="700">04</text>
