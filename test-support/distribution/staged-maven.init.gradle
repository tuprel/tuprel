import java.nio.file.Files
import java.nio.file.Path
import org.gradle.api.publish.maven.MavenPublication

// Applied only by the staging test. The normal build has no publication repository.
def configuredRepository = System.getProperty('tuprel.test.maven.repository')
if (configuredRepository == null) { throw new GradleException('Set the isolated Maven staging repository') }
def repository = Path.of(configuredRepository)
if (!repository.isAbsolute() || !repository.equals(repository.toRealPath())
        || !repository.fileName.toString().startsWith('tuprel-maven-fixture-')) {
    throw new GradleException('An isolated local repository is required for Maven staging')
}
Files.list(repository).withCloseable { entries ->
    if (entries.findAny().isPresent()) { throw new GradleException('The Maven staging repository must be empty') }
}

def fixtureVersion = System.getProperty('tuprel.test.maven.version', '0.0.0-fixture')
if (!(fixtureVersion in ['0.0.0-fixture', '0.0.1-fixture'])) {
    throw new GradleException('Expected a fixture-only Maven version')
}

def releaseEnvelope = Boolean.getBoolean('tuprel.test.maven.releaseEnvelope')
def libraries = ['tuprel-sql', 'tuprel-runtime', 'tuprel-postgresql']
if (Boolean.getBoolean('tuprel.test.maven.springConsumer')) {
    if (releaseEnvelope) { throw new GradleException('Spring consumer staging is fixture-only') }
    libraries += 'tuprel-spring-boot-starter'
}

gradle.beforeProject { library ->
    if (library.rootProject.name != 'tuprel'
            || !(library.name in libraries)) { return }
    library.group = 'dev.tuprel.staging'
    library.version = fixtureVersion
    library.pluginManager.apply('maven-publish')
    library.pluginManager.withPlugin('java') {
        if (releaseEnvelope) {
            library.java.withSourcesJar()
            library.java.withJavadocJar()
        }
        library.publishing {
            publications.create('fixture', MavenPublication) {
                from library.components.java
                if (releaseEnvelope) {
                    pom {
                        name = library.name
                        description = 'Tuprel Java persistence toolkit library'
                        url = 'https://github.com/tuprel/tuprel'
                        licenses {
                            license {
                                name = 'Apache License, Version 2.0'
                                url = 'https://www.apache.org/licenses/LICENSE-2.0'
                            }
                        }
                        developers {
                            developer {
                                id = 'tuprel'
                                name = 'Tuprel contributors'
                            }
                        }
                        scm {
                            connection = 'scm:git:https://github.com/tuprel/tuprel.git'
                            developerConnection = 'scm:git:ssh://git@github.com/tuprel/tuprel.git'
                            url = 'https://github.com/tuprel/tuprel'
                        }
                    }
                }
            }
            repositories.maven { name = 'fixture'; url = repository.toUri() }
        }
    }
}
