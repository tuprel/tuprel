import java.nio.file.Files
import java.nio.file.Path

def destination = System.getProperty('tuprel.test.gradle.repository')
if (destination == null) { throw new GradleException('Set the isolated Gradle plugin staging repository') }
def repository = Path.of(destination)
if (!repository.isAbsolute() || !repository.equals(repository.toRealPath())
        || !repository.fileName.toString().startsWith('tuprel-gradle-plugin-fixture-')) {
    throw new GradleException('An isolated local repository is required for Gradle plugin staging')
}
Files.list(repository).withCloseable { entries ->
    if (entries.findAny().isPresent()) { throw new GradleException('The plugin staging repository must be empty') }
}

gradle.beforeProject { project ->
    if (project.rootProject.name != 'tuprel' || project.name != 'tuprel-gradle-plugin') { return }
    project.group = 'dev.tuprel.staging'
    project.version = '0.0.0-fixture'
    project.pluginManager.apply('maven-publish')
    project.publishing.repositories.maven { name = 'fixture'; url = repository.toUri() }
}
