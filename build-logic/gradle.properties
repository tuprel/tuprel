# Propriedades do included build `build-logic`.
#
# Deliberadamente mínimo, pela mesma regra do gradle.properties da raiz: cada
# propriedade tem de ter uma razão explícita e verificável.

# Invocações directas (`./gradlew -p build-logic ...`) são um build autónomo e
# não lêem o gradle.properties da raiz. Estas propriedades mantêm nesses fluxos
# a política validada para configuration cache e build cache.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail
org.gradle.caching=true

# Compila o Kotlin desta build no próprio processo do Gradle em vez de arrancar
# um Kotlin daemon dedicado.
#
# Razão: build-logic tem um punhado de ficheiros Kotlin. Um daemon dedicado
# custa um JVM inteiro e a memória que reserva compete directamente com os
# processos que os testes TestKit precisam de arrancar (test executor + build
# das fixtures). Para este volume de código a compilação in-process é mais
# rápida no total e muito mais previsível.
kotlin.compiler.execution.strategy=in-process
