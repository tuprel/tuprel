version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: main
    ignore:
      - dependency-name: org.junit:junit-bom
        update-types:
          - version-update:semver-major
  - package-ecosystem: gradle
    directory: /build-logic
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: main
    ignore:
      - dependency-name: org.junit:junit-bom
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    target-branch: main
