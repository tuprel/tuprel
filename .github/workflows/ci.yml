name: CI

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['21']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Check out pinned legacy executor fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 48b08e61689cdc0678097b1419bf1b6f60b781b8
          path: .legacy-executor-fixture
          persist-credentials: false
      - name: Package the legacy executor fixture
        working-directory: .legacy-executor-fixture
        run: |
          test "$(git rev-parse HEAD)" = 48b08e61689cdc0678097b1419bf1b6f60b781b8
          ./gradlew :tuprel-cli:installDist --no-daemon --dependency-verification strict
      - name: Build and verify
        run: |
          set -euo pipefail
          fixture="$(sudo mktemp -d /home/tuprel-managed-publication.XXXXXXXX)"
          trap 'if mountpoint -q "$fixture/volume"; then sudo umount -- "$fixture/volume"; fi; sudo rm -rf -- "$fixture"' EXIT
          sudo chown "$(id -u):$(id -g)" "$fixture"
          mkdir "$fixture/volume"
          truncate -s 64M "$fixture/ext4.img"
          mkfs.ext4 -F -q "$fixture/ext4.img"
          sudo mount -t ext4 -o loop "$fixture/ext4.img" "$fixture/volume"
          test "$(findmnt -n -o FSTYPE --mountpoint "$fixture/volume")" = ext4
          sudo chown "$(id -u):$(id -g)" "$fixture/volume"
          bash native/migration-publisher/build-linux.sh "$fixture/publisher"
          if ! ./gradlew build --no-daemon --dependency-verification strict -PtuprelTestDatabase=container \
            "-PtuprelLegacyCliLauncher=$PWD/.legacy-executor-fixture/tuprel-cli/build/install/tuprel/bin/tuprel" \
            "-PtuprelTestPublisher=$fixture/publisher" "-PtuprelTestPublicationVolume=$fixture/volume"; then
            python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          report = Path('tuprel-migrate-postgresql/build/test-results/integrationTest/TEST-dev.tuprel.migrate.postgresql.InitialBootstrapIntegrationTest.xml')
          if report.is_file():
              for case in ET.parse(report).getroot().findall('testcase'):
                  if case.get('name') != 'managedPublicationWritesExactSqlWithoutApplyingIt(Path)':
                      continue
                  failure = case.find('failure')
                  if failure is not None:
                      for field in re.findall(r'(?:state=[A-Z_]+|diagnostic=Optional\[[A-Z_]*\])', failure.get('message', '')):
                          print(field)
          PY
            exit 1
          fi
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          checks = (
              ('tuprel-cli', 'dev.tuprel.cli.DeployLauncherIntegrationTest', 'pinnedLegacyExecutorLosesWriteAccessAfterFixtureCutover()'),
              ('tuprel-migrate-postgresql', 'dev.tuprel.migrate.postgresql.InitialBootstrapIntegrationTest',
               'managedPublicationWritesExactSqlWithoutApplyingIt(Path)'),
          )
          for module, suite, name in checks:
              path = f'{module}/build/test-results/integrationTest/TEST-{suite}.xml'
              cases = [case for case in ET.parse(path).getroot().findall('testcase') if case.get('name') == name]
              if len(cases) != 1 or any(cases[0].find(tag) is not None for tag in ('skipped', 'failure', 'error')):
                  raise SystemExit(f'Managed migration proof must execute and pass: {name}')
          PY
      - name: Reject the correct executor JAR under an untrusted OS account
        run: |
          set -euo pipefail
          fixture="$(sudo mktemp -d /home/tuprel-executor-probe.XXXXXXXX)"
          trap 'sudo rm -rf -- "$fixture"' EXIT
          sudo chown "$(id -u):$(id -g)" "$fixture"
          chmod 0755 "$fixture"
          adapter="$fixture/tuprel-migrate-postgresql.jar"
          migrate="$fixture/tuprel-migrate.jar"
          tests="$fixture/classes"
          install -m 0644 tuprel-migrate-postgresql/build/libs/tuprel-migrate-postgresql.jar "$adapter"
          install -m 0644 tuprel-migrate/build/libs/tuprel-migrate.jar "$migrate"
          probe_class=dev/tuprel/migrate/postgresql/ManagedExecutorPinProbe.class
          install -D -m 0644 "tuprel-migrate-postgresql/build/classes/java/integrationTest/$probe_class" "$tests/$probe_class"
          java="$JAVA_HOME/bin/java"
          digest="$(sha256sum "$adapter" | cut -d ' ' -f 1)"
          probe=dev.tuprel.migrate.postgresql.ManagedExecutorPinProbe
          classpath="$tests:$adapter:$migrate"
          "$java" -cp "$classpath" "$probe" "$adapter" "$digest" "$(id -u)" || {
            echo 'The operator must pass the full artifact and installation check.' >&2
            stat -c '%a %u %n' / /home "$fixture" "$adapter"
            exit 1
          }
          sudo -n -u nobody -- "$java" -cp "$classpath" "$probe" "$adapter" "$digest"
          set +e
          sudo -n -u nobody -- "$java" "-Duser.name=$(id -un)" -cp "$classpath" \
            "$probe" "$adapter" "$digest" "$(id -u)"
          refused=$?
          set -e
          test "$refused" -eq 2
      - name: Smoke test packaged CLI in Bash
        run: |
          ./gradlew :tuprel-cli:installDist --no-daemon --dependency-verification strict
          tuprel_cli="$PWD/tuprel-cli/build/install/tuprel/bin/tuprel"
          tuprel_demo="$(mktemp -d)"
          cd "$tuprel_demo"
          "$tuprel_cli" --help
          "$tuprel_cli" --version
          "$tuprel_cli" init --dry-run
          test ! -e tuprel
          "$tuprel_cli" init
          "$tuprel_cli" migrate --help
          "$tuprel_cli" migrate create --help
          "$tuprel_cli" migrate status --help
          "$tuprel_cli" migrate deploy --help
          "$tuprel_cli" migrate create --name initial --dry-run
          test ! -e tuprel/.migrations.create.lock
          test "$(find tuprel/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 0
          "$tuprel_cli" migrate create --name initial
          test "$(find tuprel/migrations -name migration.sql -type f | wc -l)" -eq 1
          test -f tuprel/.migrations.create.lock
          test ! -s tuprel/.migrations.create.lock
          set +e
          "$tuprel_cli" migrate create --name '../invalid_name'
          invalid_name_exit=$?
          "$tuprel_cli" migrate deploy
          deploy_usage_exit=$?
          set -e
          test "$invalid_name_exit" -eq 2
          test "$deploy_usage_exit" -eq 2
          "$tuprel_cli" validate
          "$tuprel_cli" format --check
          "$tuprel_cli" generate --dry-run
          test ! -e build
          "$tuprel_cli" generate
          "$tuprel_cli" generate --check
      - name: Compile consumer playground
        run: |
          cmp gradle/verification-metadata.xml examples/tuprel-playground/gradle/verification-metadata.xml
          ./gradlew -p examples/tuprel-playground build --no-daemon --dependency-verification strict
      - name: Require symlink confinement test on Linux
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          checks = [
              ('tuprel-codegen-java', 'dev.tuprel.codegen.GeneratedSourceWriterTest', 'rejectsSymlinkInsideOutputTree()'),
              ('tuprel-migrate', 'dev.tuprel.migrate.MigrationDirectoryTest', 'rejectsSymlinksThroughoutCatalog()'),
              ('tuprel-migrate', 'dev.tuprel.migrate.MigrationCreatorTest', 'rejectsSymlinksForCreationAndCoordination()'),
              ('tuprel-cli', 'dev.tuprel.cli.CliExperienceTest', 'rejectsSymlinksForInitAndSchemaWrites()'),
          ]
          for module, suite, name in checks:
              report = ET.parse(f'{module}/build/test-results/test/TEST-{suite}.xml')
              cases = [case for case in report.getroot().findall('testcase') if case.get('name') == name]
              if len(cases) != 1 or any(cases[0].find(tag) is not None for tag in ('skipped', 'failure', 'error')):
                  raise SystemExit(f'Symlink confinement test must execute and pass on Linux: {suite}.{name}')
              print(f'Symlink confinement test executed and passed on Linux: {suite}.{name}')
          PY

  native-linux:
    name: Native Linux ${{ matrix.filesystem }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        filesystem: [ext4, xfs]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Java publisher and proof
        run: |
          ./gradlew :tuprel-migrate:classes --no-daemon --dependency-verification strict
          javac --release 21 -encoding UTF-8 -cp tuprel-migrate/build/classes/java/main \
            -d "$RUNNER_TEMP/publication-proof" native/migration-publisher/PublicationProof.java
      - name: Build twice and prove native publication on a dedicated volume
        env:
          TEST_FILESYSTEM: ${{ matrix.filesystem }}
        run: |
          set -euo pipefail
          fixture="$(mktemp -d "$RUNNER_TEMP/tuprel-native.XXXXXXXX")"
          mkdir "$fixture/volume" "$fixture/second"
          bash native/migration-publisher/build-linux.sh "$fixture/publisher"
          bash native/migration-publisher/build-linux.sh "$fixture/second/publisher"
          cmp "$fixture/publisher" "$fixture/second/publisher"
          sha256sum "$fixture/publisher"
          if ! command -v "mkfs.$TEST_FILESYSTEM" >/dev/null; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y xfsprogs
          fi
          truncate -s 512M "$fixture/image"
          if [[ "$TEST_FILESYSTEM" == ext4 ]]; then
            mkfs.ext4 -F -q "$fixture/image"
          else
            mkfs.xfs -f -q "$fixture/image"
          fi
          sudo mount -t "$TEST_FILESYSTEM" -o loop "$fixture/image" "$fixture/volume"
          trap 'sudo umount -- "$fixture/volume"' EXIT
          test "$(findmnt -n -o FSTYPE --mountpoint "$fixture/volume")" = "$TEST_FILESYSTEM"
          sudo chown "$(id -u):$(id -g)" "$fixture/volume"
          python3 native/migration-publisher/test_native.py "$fixture/publisher" "$fixture/volume" "$TEST_FILESYSTEM"
          java -cp "tuprel-migrate/build/classes/java/main:$RUNNER_TEMP/publication-proof" \
            dev.tuprel.migrate.PublicationProof "$fixture/publisher" "$fixture/volume"

  native-windows:
    name: Native Windows NTFS
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Java publisher and proof
        shell: pwsh
        run: |
          ./gradlew.bat :tuprel-migrate:classes --no-daemon --dependency-verification strict
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          javac --release 21 -encoding UTF-8 -cp tuprel-migrate/build/classes/java/main `
            -d "$env:RUNNER_TEMP/publication-proof" native/migration-publisher/PublicationProof.java
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Build twice and prove native publication on NTFS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $fixture = Join-Path $env:RUNNER_TEMP ('tuprel-native-' + [guid]::NewGuid().ToString('N'))
          $second = Join-Path $fixture 'second'
          New-Item -ItemType Directory -Path $second -Force | Out-Null
          if ([IO.DriveInfo]::new([IO.Path]::GetPathRoot($fixture)).DriveFormat -ne 'NTFS') { throw 'NTFS required' }
          $binary = Join-Path $fixture 'publisher.exe'
          $repeat = Join-Path $second 'publisher.exe'
          & ./native/migration-publisher/build-windows.cmd $binary
          if ($LASTEXITCODE) { throw 'Native build failed' }
          & ./native/migration-publisher/build-windows.cmd $repeat
          if ($LASTEXITCODE) { throw 'Repeat native build failed' }
          $digest = (Get-FileHash -LiteralPath $binary -Algorithm SHA256).Hash
          if ($digest -ne (Get-FileHash -LiteralPath $repeat -Algorithm SHA256).Hash) { throw 'Native builds differ' }
          Write-Output "SHA-256 $digest"
          python native/migration-publisher/test_native.py $binary $fixture ntfs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp "tuprel-migrate/build/classes/java/main;$env:RUNNER_TEMP/publication-proof" `
            dev.tuprel.migrate.PublicationProof $binary $fixture
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
