name: CI

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['21']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Build and verify
        run: ./gradlew build --no-daemon --dependency-verification strict -PtuprelTestDatabase=container
      - name: Smoke test packaged CLI in Bash
        run: |
          ./gradlew :tuprel-cli:installDist --no-daemon --dependency-verification strict
          tuprel_cli="$PWD/tuprel-cli/build/install/tuprel/bin/tuprel"
          tuprel_demo="$(mktemp -d)"
          cd "$tuprel_demo"
          "$tuprel_cli" --help
          "$tuprel_cli" --version
          "$tuprel_cli" init --dry-run
          test ! -e tuprel
          "$tuprel_cli" init
          "$tuprel_cli" migrate --help
          "$tuprel_cli" migrate create --help
          "$tuprel_cli" migrate status --help
          "$tuprel_cli" migrate deploy --help
          "$tuprel_cli" migrate create --name initial --dry-run
          test ! -e tuprel/.migrations.create.lock
          test "$(find tuprel/migrations -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 0
          "$tuprel_cli" migrate create --name initial
          test "$(find tuprel/migrations -name migration.sql -type f | wc -l)" -eq 1
          test -f tuprel/.migrations.create.lock
          test ! -s tuprel/.migrations.create.lock
          set +e
          "$tuprel_cli" migrate create --name '../invalid_name'
          invalid_name_exit=$?
          "$tuprel_cli" migrate deploy
          deploy_usage_exit=$?
          set -e
          test "$invalid_name_exit" -eq 2
          test "$deploy_usage_exit" -eq 2
          "$tuprel_cli" validate
          "$tuprel_cli" format --check
          "$tuprel_cli" generate --dry-run
          test ! -e build
          "$tuprel_cli" generate
          "$tuprel_cli" generate --check
      - name: Compile consumer playground
        run: |
          cmp gradle/verification-metadata.xml examples/tuprel-playground/gradle/verification-metadata.xml
          ./gradlew -p examples/tuprel-playground build --no-daemon --dependency-verification strict
      - name: Require symlink confinement test on Linux
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          checks = [
              ('tuprel-codegen-java', 'dev.tuprel.codegen.GeneratedSourceWriterTest', 'rejectsSymlinkInsideOutputTree()'),
              ('tuprel-migrate', 'dev.tuprel.migrate.MigrationDirectoryTest', 'rejectsSymlinksThroughoutCatalog()'),
              ('tuprel-migrate', 'dev.tuprel.migrate.MigrationCreatorTest', 'rejectsSymlinksForCreationAndCoordination()'),
              ('tuprel-cli', 'dev.tuprel.cli.CliExperienceTest', 'rejectsSymlinksForInitAndSchemaWrites()'),
          ]
          for module, suite, name in checks:
              report = ET.parse(f'{module}/build/test-results/test/TEST-{suite}.xml')
              cases = [case for case in report.getroot().findall('testcase') if case.get('name') == name]
              if len(cases) != 1 or any(cases[0].find(tag) is not None for tag in ('skipped', 'failure', 'error')):
                  raise SystemExit(f'Symlink confinement test must execute and pass on Linux: {suite}.{name}')
              print(f'Symlink confinement test executed and passed on Linux: {suite}.{name}')
          PY
