name: CI

on:
  pull_request:
    branches: [main, feat/relations-transactions]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java ${{ matrix.java }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        java: ['21']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Build and verify
        run: ./gradlew build --no-daemon --dependency-verification strict -PtuprelTestDatabase=container
      - name: Compile consumer playground
        run: |
          cmp gradle/verification-metadata.xml examples/tuprel-playground/gradle/verification-metadata.xml
          ./gradlew -p examples/tuprel-playground build --no-daemon --dependency-verification strict
      - name: Require symlink confinement test on Linux
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          report = ET.parse('tuprel-codegen-java/build/test-results/test/TEST-dev.tuprel.codegen.GeneratedSourceWriterTest.xml')
          cases = [case for case in report.getroot().findall('testcase')
                   if case.get('name') == 'rejectsSymlinkInsideOutputTree()']
          if len(cases) != 1 or any(cases[0].find(tag) is not None for tag in ('skipped', 'failure', 'error')):
              raise SystemExit('Symlink confinement test must execute and pass on Linux')
          print('Symlink confinement test executed and passed on Linux')
          PY
