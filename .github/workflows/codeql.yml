name: CodeQL

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Java and Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          validate-wrappers: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
      - name: Build for analysis
        run: |
          ./gradlew build --rerun-tasks --no-build-cache --no-daemon --dependency-verification strict -PtuprelTestDatabase=container
          ./gradlew -p examples/tuprel-playground classes --rerun-tasks --no-build-cache --no-daemon --dependency-verification strict
          mkdir -p "$RUNNER_TEMP/tuprel-installer-analysis"
          javac --release 21 -Xlint:all -Werror -d "$RUNNER_TEMP/tuprel-installer-analysis" \
            test-support/distribution/SignedCliBundle.java test-support/distribution/VerifyCliBundle.java \
            test-support/distribution/StagingRoot.java test-support/distribution/StagedActivation.java \
            test-support/distribution/StagedBashPath.java test-support/distribution/StagedAuthorization.java
      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

  analyze-native:
    name: C / ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: Windows
            runner: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize native CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
      - name: Set up Java headers
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Linux helper
        if: runner.os == 'Linux'
        run: |
          bash native/migration-publisher/build-linux.sh "$RUNNER_TEMP/tuprel-publisher"
          bash native/cli-installer/build-linux-proof.sh "$RUNNER_TEMP/tuprel-installer-root-proof"
          bash native/cli-installer/build-linux-staging.sh "$RUNNER_TEMP/libtuprel-staging.so"
      - name: Build Windows helper
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./native/migration-publisher/build-windows.cmd (Join-Path $env:RUNNER_TEMP 'tuprel-publisher.exe')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./native/cli-installer/build-windows-proof.cmd (Join-Path $env:RUNNER_TEMP 'tuprel-installer-root-proof.exe')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./native/cli-installer/build-windows-staging.cmd (Join-Path $env:RUNNER_TEMP 'tuprel-staging.dll')
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ./native/cli-installer/build-windows-path.cmd (Join-Path $env:RUNNER_TEMP 'tuprel-path.exe')
          exit $LASTEXITCODE
      - name: Analyze native code
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:c-cpp/platform:${{ matrix.platform }}'
