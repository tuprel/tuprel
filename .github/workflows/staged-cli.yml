name: Staged CLI

on:
  pull_request:
    branches: [main, 'feat/**']
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Staged CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: Linux, runner: ubuntu-24.04 }
          - { platform: Windows, runner: windows-2025 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and verify an installed archive outside the checkout
        shell: pwsh
        run: |
          $gradle = if ($IsWindows) { '.\gradlew.bat' } else { './gradlew' }
          & $gradle :tuprel-cli:distZip --no-daemon --dependency-verification strict
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $archive = @(Get-ChildItem tuprel-cli/build/distributions -File -Filter '*.zip')
          if ($archive.Count -ne 1) { throw 'Expected one CLI archive' }
          ./test-support/distribution/Verify-StagedCli.ps1 -Archive $archive[0].FullName
      - name: Verify runtime libraries in a temporary Maven repository
        shell: pwsh
        run: ./test-support/distribution/Verify-StagedMaven.ps1
      - name: Sign and verify an offline Maven release envelope
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./test-support/distribution/Verify-StagedMaven.ps1 -Gpg /usr/bin/gpg
      - name: Check out the Maven upgrade baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2b9ef01baa96633efc630cae1d288c061a94256b
          path: build/maven-upgrade-fixture
          persist-credentials: false
      - name: Compile and upgrade an external Maven consumer
        shell: pwsh
        run: ./test-support/distribution/Verify-MavenConsumer.ps1 -PreviousCheckout build/maven-upgrade-fixture
      - name: Resolve the staged Gradle plugin marker in an external project
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./test-support/distribution/Verify-StagedGradlePlugin.ps1
      - name: Exercise signed installation, version switching and recovery
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./test-support/distribution/Verify-SignedCli.ps1
      - name: Exercise signed installation on a dedicated ext4 volume
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$(mktemp -d "$RUNNER_TEMP/tuprel-staging.XXXXXXXX")"
          mkdir "$fixture/volume"
          truncate -s 512M "$fixture/image"
          mkfs.ext4 -F -q "$fixture/image"
          sudo mount -t ext4 -o loop "$fixture/image" "$fixture/volume"
          trap 'sudo umount -- "$fixture/volume"' EXIT
          sudo chown "$(id -u):$(id -g)" "$fixture/volume"
          pwsh -File ./test-support/distribution/Verify-SignedCli.ps1 -FixtureParent "$fixture/volume"
